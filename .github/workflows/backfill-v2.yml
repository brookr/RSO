name: Backfill v2 Bundles

# One-time (re-runnable) backfill: publish v2 sibling bundles for days whose
# v1 release assets are frozen. Uploads each bundle once to Arweave (funded
# wallet in repo secrets) and attaches a -v2 GitHub release asset on the
# existing day tag, then commits the updated storage receipts to the node
# branch. Idempotent: existing assets and recorded Arweave transactions are
# skipped, so the workflow can resume after any interruption.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First archive date, YYYY-MM-DD."
        required: true
        type: string
      end:
        description: "Last archive date, YYYY-MM-DD."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rso-node-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RSO_NODE_BRANCH: ${{ vars.RSO_NODE_BRANCH || 'node' }}
    steps:
      - name: Validate date inputs
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          for name in ("INPUT_START", "INPUT_END"):
              value = os.environ.get(name, "")
              if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", value) is None:
                  print(f"Invalid {name}: {value!r}")
                  sys.exit(1)
          PY
          {
            echo "RSO_BACKFILL_START=${INPUT_START}"
            echo "RSO_BACKFILL_END=${INPUT_END}"
          } >> "$GITHUB_ENV"

      - name: Check out node branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RSO_NODE_BRANCH }}
          fetch-depth: 0

      - name: Hydrate catalogs for the range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 pipeline/snapshot.py hydrate-catalogs \
            --start "$RSO_BACKFILL_START" --end "$RSO_BACKFILL_END"

      - name: Publish v2 bundles (GitHub asset + single Arweave upload per day)
        env:
          GH_TOKEN: ${{ github.token }}
          ARWEAVE_JWK: ${{ secrets.ARWEAVE_JWK }}
        run: |
          set -euo pipefail
          python3 pipeline/snapshot.py publish \
            --start "$RSO_BACKFILL_START" --end "$RSO_BACKFILL_END" \
            --v2-backfill

      - name: Commit storage receipts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No storage receipt changes to commit."
            exit 0
          fi
          git commit -m "Record v2 bundle publish destinations"
          git push origin "HEAD:$RSO_NODE_BRANCH"
